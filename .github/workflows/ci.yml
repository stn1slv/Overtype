name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Apple provider uses the macOS 27 FoundationModels API, which needs
    # Xcode 27; macos-latest ships Xcode 26 (specs/011 research R2).
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Command Line Tools lack the SwiftUI macro plugins, so use full Xcode.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: swift test
