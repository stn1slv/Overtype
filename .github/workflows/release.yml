name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build & Release App
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Load-bearing: scripts/build-app.sh stamps CFBundleVersion from
          # `git rev-list --count HEAD`. A shallow clone returns a truncated
          # count with exit 0, so lowering this ships a wrong build number
          # silently. It is also needed for the tag to be visible.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build .app bundle
        run: |
          # Same expression used below for the zip name and the cask, so the
          # version shown inside the app cannot diverge from the release assets.
          OVERTYPE_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
          
      - name: Zip .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "Overtype_${VERSION}_macos.zip" Overtype.app

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "Overtype_${VERSION}_macos.zip" --clobber

      - name: Publish Homebrew Cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/publish-cask.sh "$VERSION" "Overtype_${VERSION}_macos.zip"
