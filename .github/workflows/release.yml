name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build & Release App
    # The Apple provider uses the macOS 27 FoundationModels API, which needs
    # Xcode 27; macos-latest ships Xcode 26 (specs/011 research R2).
    runs-on: xcode-27
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing: scripts/build-app.sh stamps CFBundleVersion from
          # `git rev-list --count HEAD`, which needs the full history. The
          # script refuses to stamp from a shallow clone rather than ship a
          # truncated count, so lowering this does not corrupt the build
          # identifier, it downgrades it to the fallback declared in
          # Info.plist and the release then reports build 0.
          fetch-depth: 0

      # Pinned to the toolchain the Apple provider was verified with; on the
      # xcode-27 image Xcode.app is 27.1 (specs/011).
      # The list comes first, so when an image update removes 27.2 the log
      # shows which versions it has before xcode-select fails.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build .app bundle
        run: |
          # Same expression used below for the zip name and the cask, so the
          # version shown inside the app cannot diverge from the release assets.
          OVERTYPE_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      # The app targets macOS 13 but uses FoundationModels (macOS 27) behind
      # #available. A strong link would stop the app from launching on
      # macOS 13 to 26, and CI runs only on macOS 27, so check the load
      # command before publishing (specs/011 research R3).
      - name: Check FoundationModels is weak-linked
        run: |
          otool -l Overtype.app/Contents/MacOS/Overtype \
            | grep -B3 'FoundationModels.framework' \
            | grep -q 'LC_LOAD_WEAK_DYLIB' \
            || { echo "FoundationModels is not weak-linked; the app would not launch before macOS 27." >&2; exit 1; }
          
      - name: Zip .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "Overtype_${VERSION}_macos.zip" Overtype.app

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Title is the bare tag ("v1.3.0"), not "Release v1.3.0", so the
          # release name and the tag it points at read identically everywhere
          # they are listed side by side.
          #
          # `create` fails with HTTP 422 when the release already exists, which
          # is what happens on a re-run. Fall back to `edit` instead of the
          # older `|| true`: that swallowed the failure and left an existing
          # release under whatever title it already had, so a re-run could not
          # repair a wrongly named one. Dropping `|| true` also stops a genuine
          # create failure from passing as success.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "Overtype_${VERSION}_macos.zip" --clobber

      - name: Publish Homebrew Cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/publish-cask.sh "$VERSION" "Overtype_${VERSION}_macos.zip"
